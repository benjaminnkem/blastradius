services:
  # ============================================================================
  # BlastRadius — NestJS Public Read API Service
  # ============================================================================
  - type: web
    name: blastradius-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ARKIV_RPC_URL
        value: https://rpc.kaolin.arkiv.network
      - key: ARKIV_CHAIN_ID
        value: "1001"
      - key: ARKIV_PROJECT_NAMESPACE
        value: blastradius-v1
      - key: BASE_RPC_PRIMARY
        value: https://mainnet.base.org
      - key: BASE_RPC_SECONDARY
        value: https://base.llamarpc.com
      - key: BASE_RPC_TERTIARY
        value: https://1rpc.io/base
      - key: REDIS_URL
        fromService:
          type: redis
          name: blastradius-redis
          property: connectionString

  # ============================================================================
  # BlastRadius — Background Observation Monitor Daemon
  # ============================================================================
  - type: worker
    name: blastradius-monitor
    runtime: docker
    dockerfilePath: apps/monitor/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: ARKIV_RPC_URL
        value: https://rpc.kaolin.arkiv.network
      - key: ARKIV_CHAIN_ID
        value: "1001"
      - key: ARKIV_PROJECT_NAMESPACE
        value: blastradius-v1
      - key: BASE_RPC_PRIMARY
        value: https://mainnet.base.org
      - key: BASE_RPC_SECONDARY
        value: https://base.llamarpc.com
      - key: BASE_RPC_TERTIARY
        value: https://1rpc.io/base
      - key: MONITOR_PRIVATE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: blastradius-redis
          property: connectionString

  # ============================================================================
  # BlastRadius — Transient Redis Service (BullMQ & Locks)
  # ============================================================================
  - type: redis
    name: blastradius-redis
    plan: free
    region: oregon
    ipAllowList: []
