<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Terminal Box -->
  <rect width="64" height="64" fill="#080a08" rx="0"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#33ff00" stroke-width="2"/>
  
  <!-- Outer Shockwave Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1f401f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#2b662b" stroke-width="1.5"/>
  
  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="20" stroke="#33ff00" stroke-width="1.5"/>
  <line x1="32" y1="44" x2="32" y2="58" stroke="#33ff00" stroke-width="1.5"/>
  <line x1="6" y1="32" x2="20" y2="32" stroke="#33ff00" stroke-width="1.5"/>
  <line x1="44" y1="32" x2="58" y2="32" stroke="#33ff00" stroke-width="1.5"/>
  
  <!-- Central Blast Core -->
  <rect x="25" y="25" width="14" height="14" fill="#ffb000" stroke="#33ff00" stroke-width="1.5"/>
  <rect x="29" y="29" width="6" height="6" fill="#33ff00"/>
</svg>
